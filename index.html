<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daiana Fraiman · People & Talent Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F2ECDD;
    --bg-card: #FBF8F0;
    --deep: #241B2E;
    --deep-2: #322542;
    --ink: #2B2233;
    --ink-soft: #5B5266;
    --gold: #B98B3E;
    --gold-soft: #E4C98B;
    --lavender: #6F5E82;
    --line: #DCD3C0;
    --line-deep: #4A3D5C;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth; scroll-padding-top:90px;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    line-height:1.6;
    overflow-x:hidden;
  }
  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    *{animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important;}
  }

  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.72rem;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--gold);
    font-weight:500;
  }
  h1,h2,h3{ font-family:'Fraunces', serif; font-weight:600; letter-spacing:-0.01em; }

  /* ============ NAV ============ */
  nav{
    position:fixed; top:0; left:0; right:0; z-index:100;
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 6vw;
    background:rgba(242,236,221,0.88);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
    transform:translateY(-100%);
    transition:transform 0.4s ease;
  }
  nav.visible{ transform:translateY(0); }
  .nav-name{ font-family:'Fraunces', serif; font-weight:600; font-size:1rem; color:var(--ink); }
  .nav-links{ display:flex; gap:28px; }
  .nav-links a{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.7rem; letter-spacing:0.08em; text-transform:uppercase;
    color:var(--ink-soft); text-decoration:none;
    border-bottom:1px solid transparent;
    padding-bottom:2px;
    transition:color 0.2s, border-color 0.2s;
  }
  .nav-links a:hover, .nav-links a:focus-visible{ color:var(--gold); border-color:var(--gold); }
  @media (max-width:800px){ .nav-links{ display:none; } }

  /* ============ HERO ============ */
  .hero{
    min-height:100vh;
    background:radial-gradient(ellipse 120% 90% at 30% 0%, var(--deep-2), var(--deep));
    color:#F2ECDD;
    display:flex; align-items:center;
    padding:14vh 6vw 8vh;
    position:relative;
    overflow:hidden;
  }
  .hero::before{
    content:"";
    position:absolute; inset:0;
    background-image:
      linear-gradient(var(--line-deep) 1px, transparent 1px),
      linear-gradient(90deg, var(--line-deep) 1px, transparent 1px);
    background-size:64px 64px;
    opacity:0.12;
    mask-image:radial-gradient(ellipse 80% 60% at 30% 30%, black, transparent);
  }
  .hero-inner{
    display:grid;
    grid-template-columns:1.3fr 0.9fr;
    gap:6vw;
    align-items:center;
    max-width:1280px;
    width:100%;
    margin:0 auto;
    position:relative;
    z-index:2;
  }
  .hero-eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.75rem; letter-spacing:0.2em; text-transform:uppercase;
    color:var(--gold-soft);
    display:flex; align-items:center; gap:10px;
    margin-bottom:26px;
    opacity:0;
    animation:fadeUp 0.8s ease 0.1s forwards;
  }
  .hero-eyebrow .dot{ width:6px; height:6px; border-radius:50%; background:var(--gold-soft); }
  .hero h1{
    font-size:clamp(2.6rem, 5.4vw, 4.6rem);
    line-height:1.02;
    font-weight:600;
    color:#FBF8F0;
    opacity:0;
    animation:fadeUp 0.8s ease 0.25s forwards;
  }
  .hero h1 em{ font-style:italic; font-weight:400; color:var(--gold-soft); }
  .hero-role{
    margin-top:20px;
    font-size:1.15rem;
    color:#D9CFE4;
    max-width:46ch;
    opacity:0;
    animation:fadeUp 0.8s ease 0.4s forwards;
  }
  .hero-tags{
    margin-top:34px;
    display:flex; flex-wrap:wrap; gap:10px;
    opacity:0;
    animation:fadeUp 0.8s ease 0.55s forwards;
  }
  .hero-tags span{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.72rem; letter-spacing:0.04em;
    padding:7px 14px;
    border:1px solid var(--line-deep);
    border-radius:100px;
    color:#C9BEDA;
  }
  .hero-photo-wrap{
    position:relative;
    opacity:0;
    animation:fadeUp 0.9s ease 0.35s forwards;
  }
  .hero-photo{
    width:100%;
    aspect-ratio:0.86;
    object-fit:cover;
    border-radius:6px;
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.55);
    filter:grayscale(15%) contrast(1.02);
  }
  .hero-photo-frame{
    position:absolute; inset:-14px;
    border:1px solid var(--gold-soft);
    border-radius:10px;
    opacity:0.5;
    pointer-events:none;
  }
  @keyframes fadeUp{ from{opacity:0; transform:translateY(18px);} to{opacity:1; transform:translateY(0);} }

  .scroll-cue{
    position:absolute; bottom:36px; left:50%; transform:translateX(-50%);
    display:flex; flex-direction:column; align-items:center; gap:8px;
    color:#B7ACC8;
    font-family:'IBM Plex Mono', monospace;
    font-size:0.65rem; letter-spacing:0.14em; text-transform:uppercase;
    z-index:2;
  }
  .scroll-cue .line{ width:1px; height:34px; background:linear-gradient(#B7ACC8, transparent); animation:pulse 1.8s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{opacity:0.3;} 50%{opacity:1;} }

  @media (max-width:900px){
    .hero{ padding-bottom:10vh; }
    .scroll-cue{ display:none; }
  }
  @media (max-width:800px){
    .hero-inner{ grid-template-columns:1fr; }
    .hero-photo-wrap{ order:-1; max-width:220px; margin:0 auto; }
  }

  /* ============ SECTION SHELL ============ */
  section{ padding:9vh 6vw; }
  .wrap{ max-width:1120px; margin:0 auto; }

  /* ============ INTRO ============ */
  .intro{
    display:grid; grid-template-columns:0.6fr 1fr; gap:6vw;
    padding-top:12vh;
  }
  .intro .eyebrow{ margin-bottom:18px; }
  .intro h2{ font-size:clamp(1.7rem, 3vw, 2.3rem); line-height:1.2; color:var(--ink); }
  .intro p{ color:var(--ink-soft); font-size:1.03rem; max-width:58ch; }
  .intro p + p{ margin-top:16px; }
  @media (max-width:800px){ .intro{ grid-template-columns:1fr; gap:20px; } }

  /* ============ TIMELINE STRIP ============ */
  .timeline-section{ background:var(--bg-card); border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
  .timeline-head{ margin-bottom:48px; }
  .timeline-head h2{ font-size:clamp(1.6rem,2.6vw,2.1rem); margin-top:10px; }
  .timeline-track{ padding-top:6px; }
  .timeline-row{
    display:flex; flex-wrap:wrap;
    gap:30px 34px;
  }
  .t-item{
    flex:1 1 190px;
    max-width:230px;
    border-top:2px solid var(--gold);
    padding-top:16px;
  }
  .t-date-row{ display:flex; align-items:center; gap:7px; margin-bottom:7px; }
  .t-dot{ width:6px; height:6px; border-radius:50%; background:var(--gold); flex:0 0 auto; }
  .t-date{ font-family:'IBM Plex Mono', monospace; font-size:0.72rem; color:var(--lavender); letter-spacing:0.03em; }
  .t-role{ font-family:'Fraunces', serif; font-weight:600; font-size:1.05rem; margin-bottom:4px; color:var(--ink); }
  .t-org{ font-size:0.9rem; color:var(--ink-soft); }
  .t-item.edu{ border-top-color:var(--lavender); }
  .t-item.edu .t-dot{ background:var(--lavender); }
  .t-item.edu .t-role{ color:var(--lavender); }

  .cert-cluster{
    margin-top:10px;
    display:flex; flex-wrap:wrap; gap:8px;
  }
  .cert-cluster span{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.68rem;
    padding:6px 11px;
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:5px;
    color:var(--ink-soft);
  }
  .cert-label{ font-family:'IBM Plex Mono', monospace; font-size:0.68rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--lavender); margin-top:40px; margin-bottom:12px; display:block; }

  /* ============ CYCLE INTRO BAND ============ */
  .cycle-band{
    background:var(--deep);
    color:#F2ECDD;
    text-align:center;
    padding:10vh 6vw 7vh;
  }
  .cycle-band .eyebrow{ color:var(--gold-soft); }
  .cycle-band h2{ font-size:clamp(1.9rem,3.6vw,2.8rem); margin-top:14px; color:#FBF8F0; max-width:20ch; margin-left:auto; margin-right:auto; }
  .cycle-band p{ color:#C9BEDA; max-width:58ch; margin:18px auto 0; font-size:1.02rem; }
  .cycle-nav{
    display:flex; justify-content:center; flex-wrap:wrap; gap:12px;
    margin-top:44px;
  }
  .cycle-nav a{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.72rem; letter-spacing:0.05em;
    color:#E7DFF2;
    text-decoration:none;
    padding:10px 18px;
    border:1px solid var(--line-deep);
    border-radius:100px;
    display:flex; align-items:center; gap:8px;
    transition:border-color 0.25s, color 0.25s, background 0.25s;
  }
  .cycle-nav a .n{ color:var(--gold-soft); }
  .cycle-nav a:hover, .cycle-nav a:focus-visible{ border-color:var(--gold-soft); color:#fff; background:rgba(233,201,139,0.08); }

  /* ============ THREAD / STAGES ============ */
  .thread-section{ position:relative; padding-top:10vh; }
  .thread-line{
    position:absolute;
    left:calc(6vw + 27px);
    top:0; bottom:0;
    width:2px;
    background:var(--line);
    z-index:0;
  }
  .thread-line-fill{
    position:absolute; left:0; top:0; width:100%; height:0%;
    background:linear-gradient(var(--gold), var(--lavender));
    transition:height 0.1s linear;
  }
  .stage{
    position:relative;
    display:grid;
    grid-template-columns:56px 1fr;
    gap:32px;
    padding:0 0 12vh;
    max-width:1120px;
    margin:0 auto;
    scroll-margin-top:90px;
  }
  .stage:last-child{ padding-bottom:4vh; }
  .stage-node{
    position:relative; z-index:1;
    width:56px; height:56px; border-radius:50%;
    background:var(--bg-card);
    border:2px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono', monospace;
    font-size:0.85rem; color:var(--ink-soft);
    transition:border-color 0.5s, color 0.5s, background 0.5s, box-shadow 0.5s;
  }
  .stage.active .stage-node{
    border-color:var(--gold);
    color:var(--gold);
    background:var(--bg-card);
    box-shadow:0 0 0 6px rgba(185,139,62,0.12);
  }
  .stage-content{ padding-top:2px; }
  .stage-eyebrow{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .stage h3{ font-size:clamp(1.4rem,2.4vw,1.9rem); color:var(--ink); margin-bottom:16px; }
  .stage-sub{ color:var(--ink-soft); font-size:1rem; max-width:64ch; margin-bottom:28px; }

  .story-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:18px; margin-bottom:22px;}
  @media (max-width:900px){ .story-grid{ grid-template-columns:1fr; } }
  .story-card{
    background:var(--bg-card);
    border:1px solid var(--line);
    border-radius:8px;
    padding:22px 20px;
  }
  .story-org{ font-family:'IBM Plex Mono', monospace; font-size:0.68rem; letter-spacing:0.06em; text-transform:uppercase; color:var(--lavender); margin-bottom:10px; }
  .story-card p{ font-size:0.93rem; color:var(--ink); }

  .stage-desc{ color:var(--ink); font-size:1rem; max-width:66ch; margin-bottom:22px; }
  .stage-list{ list-style:none; margin-bottom:26px; }
  .stage-list li{
    position:relative; padding-left:24px; margin-bottom:11px;
    font-size:0.97rem; color:var(--ink); max-width:64ch;
  }
  .stage-list li::before{
    content:"—"; position:absolute; left:0; top:0;
    color:var(--gold); font-family:'IBM Plex Mono', monospace;
  }
  .stage-note{
    font-style:italic; color:var(--ink-soft); font-size:0.95rem;
    max-width:60ch; border-left:2px solid var(--line); padding-left:16px; margin-top:8px;
  }

  .t-org a{ color:inherit; text-decoration:none; border-bottom:1px dotted var(--ink-soft); transition:color 0.2s, border-color 0.2s; }
  .t-org a:hover, .t-org a:focus-visible{ color:var(--gold); border-color:var(--gold); }

  .highlight-card{
    background:linear-gradient(135deg, var(--deep), var(--deep-2));
    color:#F2ECDD;
    border-radius:10px;
    padding:30px 32px;
    margin-top:8px;
    display:grid;
    grid-template-columns:auto 1fr;
    gap:26px;
    align-items:center;
  }
  @media (max-width:700px){ .highlight-card{ grid-template-columns:1fr; } }
  .highlight-num{
    font-family:'Fraunces', serif;
    font-size:3.2rem;
    font-weight:600;
    color:var(--gold-soft);
    line-height:1;
    white-space:nowrap;
  }
  .highlight-num small{ font-size:1.1rem; font-weight:400; display:block; color:#C9BEDA; margin-top:6px; }
  .highlight-card p{ font-size:0.98rem; color:#E7DFF2; }
  .highlight-card p strong{ color:#fff; }

  .photo-placeholder{
    border:1.5px dashed var(--lavender);
    border-radius:8px;
    padding:34px 20px;
    text-align:center;
    background:repeating-linear-gradient(135deg, rgba(111,94,130,0.04) 0px, rgba(111,94,130,0.04) 10px, transparent 10px, transparent 20px);
  }
  .photo-placeholder .ph-icon{ font-size:1.5rem; margin-bottom:8px; display:block; opacity:0.6;}
  .photo-placeholder span{ font-family:'IBM Plex Mono', monospace; font-size:0.7rem; color:var(--lavender); letter-spacing:0.03em; }
  .photo-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-top:4px;}
  @media (max-width:700px){ .photo-grid{ grid-template-columns:1fr 1fr; } }

  .photo-card{ border-radius:8px; overflow:hidden; border:1px solid var(--line); background:var(--bg-card); }
  .photo-card img{ width:100%; aspect-ratio:4/3; object-fit:cover; display:block; }
  .photo-card figcaption{ padding:12px 14px; font-family:'IBM Plex Mono', monospace; font-size:0.68rem; color:var(--ink-soft); letter-spacing:0.02em; line-height:1.5; }

  .tool-row{ display:flex; flex-wrap:wrap; gap:9px; margin-top:20px; }
  .tool-row span{
    font-family:'IBM Plex Mono', monospace; font-size:0.7rem;
    padding:7px 13px; border:1px solid var(--line); border-radius:100px;
    color:var(--ink-soft); background:var(--bg-card);
  }

  /* ============ CLOSING ============ */
  .closing{
    background:var(--deep);
    color:#F2ECDD;
    padding:14vh 6vw 10vh;
    text-align:center;
    position:relative;
    overflow:hidden;
    scroll-margin-top:70px;
  }
  .closing::before{
    content:"";
    position:absolute; inset:0;
    background-image:linear-gradient(var(--line-deep) 1px, transparent 1px), linear-gradient(90deg, var(--line-deep) 1px, transparent 1px);
    background-size:64px 64px;
    opacity:0.1;
    mask-image:radial-gradient(ellipse 70% 70% at 50% 30%, black, transparent);
  }
  .closing-inner{ position:relative; z-index:2; max-width:760px; margin:0 auto; }
  .closing .eyebrow{ color:var(--gold-soft); }
  .closing h2{ font-size:clamp(1.9rem,4vw,2.9rem); margin-top:18px; line-height:1.15; color:#FBF8F0; }
  .closing h2 em{ font-style:italic; font-weight:400; color:var(--gold-soft); }
  .closing p{ color:#C9BEDA; margin-top:22px; font-size:1.05rem; max-width:58ch; margin-left:auto; margin-right:auto; }
  .contact-row{
    margin-top:48px;
    display:flex; justify-content:center; flex-wrap:wrap; gap:14px;
  }
  .contact-row a{
    font-family:'IBM Plex Mono', monospace; font-size:0.78rem;
    color:#F2ECDD; text-decoration:none;
    padding:13px 22px;
    border:1px solid var(--line-deep);
    border-radius:100px;
    transition:border-color 0.25s, background 0.25s;
    display:inline-flex; align-items:center; gap:8px;
  }
  .contact-row a:hover, .contact-row a:focus-visible{ border-color:var(--gold-soft); background:rgba(233,201,139,0.08); }
  .contact-row a.primary{ background:var(--gold-soft); color:var(--deep); border-color:var(--gold-soft); font-weight:600; }
  .contact-row a.primary:hover{ background:#F0DCA9; }
  footer{ text-align:center; padding:26px; font-family:'IBM Plex Mono', monospace; font-size:0.68rem; color:var(--line-deep); background:var(--deep); }

  a:focus-visible, button:focus-visible{ outline:2px solid var(--gold); outline-offset:3px; }
</style>
</head>
<body>

<nav id="mainNav">
  <div class="nav-name" id="navName"></div>
  <div class="nav-links" id="navLinks"></div>
</nav>

<header class="hero" id="hero"></header>

<section class="intro" id="introSection"></section>

<section class="timeline-section" id="timelineSection"></section>

<section class="cycle-band" id="cycleBand"></section>

<section class="thread-section" id="threadSection">
  <div class="thread-line"><div class="thread-line-fill" id="threadFill"></div></div>
  <div id="stagesContainer"></div>
</section>

<section class="closing" id="contacto"></section>

<footer id="footerText"></footer>

<script>
const esc = (s) => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function render(data){
  document.title = 'Daiana Fraiman · People & Talent Portfolio';

  // NAV
  document.getElementById('navName').textContent = data.hero.nameLine1 + ' ' + data.hero.nameLine2;
  document.getElementById('navLinks').innerHTML =
    data.stages.map(s => `<a href="#${esc(s.id)}">${esc(s.navLabel)}</a>`).join('') +
    `<a href="#contacto">Contacto</a>`;

  // HERO
  document.getElementById('hero').innerHTML = `
    <div class="hero-inner">
      <div>
        <div class="hero-eyebrow"><span class="dot"></span>${esc(data.hero.eyebrow)}</div>
        <h1>${esc(data.hero.nameLine1)}<br>${esc(data.hero.nameLine2)}</h1>
        <p class="hero-role">${esc(data.hero.role)}</p>
        <div class="hero-tags">${data.hero.tags.map(t => `<span>${esc(t)}</span>`).join('')}</div>
      </div>
      <div class="hero-photo-wrap">
        <img class="hero-photo" src="${esc(data.hero.photo)}" alt="Retrato de ${esc(data.hero.nameLine1)} ${esc(data.hero.nameLine2)}">
        <div class="hero-photo-frame"></div>
      </div>
    </div>
    <div class="scroll-cue"><span>${esc(data.hero.scrollLabel)}</span><div class="line"></div></div>
  `;

  // ABOUT / INTRO
  document.getElementById('introSection').innerHTML = `
    <div class="wrap" style="display:contents;">
      <div><div class="eyebrow">${esc(data.about.eyebrow)}</div></div>
      <div>
        <h2>${esc(data.about.heading)}</h2>
        ${data.about.paragraphs.map(p => `<p>${esc(p)}</p>`).join('')}
      </div>
    </div>
  `;

  // TIMELINE
  const tItem = (it, isEdu) => `
    <div class="t-item ${isEdu ? 'edu' : ''}">
      <div class="t-date-row"><span class="t-dot"></span>${it.date ? `<span class="t-date">${esc(it.date)}</span>` : ''}</div>
      <div class="t-role">${esc(it.role)}</div>
      <div class="t-org">${it.link ? `<a href="${esc(it.link)}" target="_blank" rel="noopener">${esc(it.org)}</a>` : esc(it.org)}</div>
    </div>`;
  document.getElementById('timelineSection').innerHTML = `
    <div class="wrap">
      <div class="timeline-head">
        <div class="eyebrow">${esc(data.timeline.eyebrow)}</div>
        <h2>${esc(data.timeline.heading)}</h2>
      </div>
      <span class="cert-label" style="margin-top:0;">${esc(data.timeline.educationLabel)}</span>
      <div class="timeline-track"><div class="timeline-row">
        ${data.timeline.education.map(it => tItem(it, true)).join('')}
      </div></div>
      <span class="cert-label" style="margin-top:56px;">${esc(data.timeline.experienceLabel)}</span>
      <div class="timeline-track"><div class="timeline-row">
        ${data.timeline.experience.map(it => tItem(it, false)).join('')}
      </div></div>
    </div>
  `;

  // CYCLE BAND
  document.getElementById('cycleBand').innerHTML = `
    <div class="eyebrow">${esc(data.cycle.eyebrow)}</div>
    <h2>${esc(data.cycle.heading)}</h2>
    <p>${esc(data.cycle.paragraph)}</p>
    <div class="cycle-nav">
      ${data.stages.map(s => `<a href="#${esc(s.id)}"><span class="n">${esc(s.number)}</span> ${esc(s.navLabel)}</a>`).join('')}
    </div>
  `;

  // STAGES
  document.getElementById('stagesContainer').innerHTML = data.stages.map(s => {
    let extra = '';
    if (s.highlight) {
      extra += `
        <div class="highlight-card">
          <div class="highlight-num">${esc(s.highlight.num)}<small>${esc(s.highlight.label)}</small></div>
          <p>${esc(s.highlight.text)} ${s.highlight.boldText ? `<strong>${esc(s.highlight.boldText)}</strong>` : ''}</p>
        </div>`;
    }
    if (s.photos && s.photos.length) {
      extra += `
        <div class="photo-grid" style="grid-template-columns:repeat(2,1fr);">
          ${s.photos.map(p => `
            <figure class="photo-card">
              <img src="${esc(p.src)}" alt="${esc(p.alt)}">
              <figcaption>${esc(p.caption)}</figcaption>
            </figure>`).join('')}
        </div>`;
    }
    if (s.note) {
      extra += `<p class="stage-note">${esc(s.note)}</p>`;
    }
    if (s.tools && s.tools.length) {
      extra += `<div class="tool-row">${s.tools.map(t => `<span>${esc(t)}</span>`).join('')}</div>`;
    }
    return `
      <div class="stage" id="${esc(s.id)}" data-stage>
        <div class="stage-node">${esc(s.number)}</div>
        <div class="stage-content">
          <div class="stage-eyebrow"><span class="eyebrow">Etapa ${esc(s.number)}</span></div>
          <h3>${esc(s.title)}</h3>
          <p class="stage-sub">${esc(s.sub)}</p>
          <ul class="stage-list">${s.list.map(li => `<li>${esc(li)}</li>`).join('')}</ul>
          ${extra}
        </div>
      </div>`;
  }).join('');

  // CLOSING
  document.getElementById('contacto').innerHTML = `
    <div class="closing-inner">
      <div class="eyebrow">${esc(data.closing.eyebrow)}</div>
      <h2>${data.closing.heading}</h2>
      <p>${esc(data.closing.paragraph)}</p>
      <div class="contact-row">
        ${data.closing.contacts.map(c => `<a class="${c.primary ? 'primary' : ''}" href="${esc(c.href)}" ${c.href.startsWith('http') ? 'target="_blank" rel="noopener"' : ''}>${esc(c.label)}</a>`).join('')}
      </div>
    </div>
  `;

  // FOOTER
  document.getElementById('footerText').textContent = data.footer;
}

function initInteractions(){
  const nav = document.getElementById('mainNav');
  window.addEventListener('scroll', () => {
    if (window.scrollY > 400) nav.classList.add('visible'); else nav.classList.remove('visible');
  });

  const threadFill = document.getElementById('threadFill');
  const threadSection = document.querySelector('.thread-section');
  const stages = document.querySelectorAll('[data-stage]');

  function updateThread(){
    const rect = threadSection.getBoundingClientRect();
    const vh = window.innerHeight;
    const total = rect.height;
    const scrolled = Math.min(Math.max(vh*0.5 - rect.top, 0), total);
    const pct = total > 0 ? (scrolled/total)*100 : 0;
    threadFill.style.height = pct + '%';
  }
  window.addEventListener('scroll', updateThread);
  window.addEventListener('resize', updateThread);
  updateThread();

  const io = (typeof IntersectionObserver !== 'undefined') ? new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){ entry.target.classList.add('active'); }
    });
  }, {threshold:0.35}) : null;
  if (io) stages.forEach(s=>io.observe(s));
}

fetch('content.json?_=' + Date.now())
  .then(r => r.json())
  .then(data => {
    render(data);
    try { initInteractions(); } catch(e) { console.error('Interacciones (scroll/animación) fallaron:', e); }
  })
  .catch(err => {
    document.body.innerHTML = '<p style="padding:40px;font-family:sans-serif;">No se pudo cargar el contenido (content.json). ' + err + '</p>';
  });
</script>

</body>
</html>
